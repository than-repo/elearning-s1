version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: elearning-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: elearning_db
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword123
    ports:
      - '3310:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
